<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>n1puts.ru</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Unbounded:wght@900&display=swap" rel="stylesheet">

<style>
html,body{margin:0;padding:0;background:#0a0208;overflow-x:hidden}
*{box-sizing:border-box}
@keyframes strobe{0%{background:#ff0090}12%{background:#00ffe1}25%{background:#ffe600}37%{background:#7b00ff}50%{background:#00ff2f}62%{background:#ff3b00}75%{background:#00ffe1}87%{background:#ff00d4}100%{background:#ff0090}}
@keyframes spin3d{0%{transform:rotateX(0deg) rotateZ(-4deg) scale(1)}25%{transform:rotateX(18deg) rotateZ(5deg) scale(1.06)}50%{transform:rotateX(0deg) rotateZ(-6deg) scale(.96)}75%{transform:rotateX(-16deg) rotateZ(4deg) scale(1.08)}100%{transform:rotateX(0deg) rotateZ(-4deg) scale(1)}}
@keyframes slideL{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes slideR{from{transform:translateX(-50%)}to{transform:translateX(0)}}
@keyframes hue{from{filter:hue-rotate(0deg)}to{filter:hue-rotate(360deg)}}
@keyframes shake{0%,100%{transform:translate(0,0) rotate(0)}20%{transform:translate(-9px,4px) rotate(-1.2deg)}40%{transform:translate(7px,-6px) rotate(1.4deg)}60%{transform:translate(-5px,-3px) rotate(-.8deg)}80%{transform:translate(8px,5px) rotate(1deg)}}
@keyframes wobble{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes float1{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-26px) rotate(3deg)}}
@keyframes crawl{from{transform:translateX(100vw)}to{transform:translateX(-120%)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
body{font-family:"Russo One",Impact,sans-serif;color:#fff}
.site{position:relative;min-height:100vh;overflow:hidden;font-family:"Russo One",Impact,sans-serif;animation:1.1s steps(1) infinite strobe;cursor:crosshair;user-select:none;-webkit-tap-highlight-color:transparent}
.bg-rays{position:fixed;inset:0;z-index:0;background:repeating-conic-gradient(rgba(0,0,0,.55) 0deg,rgba(0,0,0,.55) 9deg,rgba(255,255,255,.12) 9deg,rgba(255,255,255,.12) 18deg);animation:6s linear infinite hue;pointer-events:none}
.scanlines{position:fixed;inset:0;z-index:10;background:repeating-linear-gradient(0deg,rgba(0,0,0,.35) 0,rgba(0,0,0,.35) 2px,transparent 2px,transparent 4px);pointer-events:none}
.top-ticker{position:relative;z-index:2;overflow:hidden;background:#000;border-bottom:6px solid #ffe600;padding:6px 0;white-space:nowrap;color:#00ff2f;font-size:clamp(18px,2.4vw,34px);letter-spacing:2px;font-weight:900}
.ticker-track{display:flex;gap:40px;width:max-content;animation:7s linear infinite slideL}.ticker-track span{flex:none}
main{position:relative;z-index:1;padding:clamp(70px,14vw,120px) clamp(12px,4vw,24px) 90px;display:flex;flex-direction:column;align-items:center;gap:30px}
.logo-wrap{perspective:900px;width:100%}.logo{margin:0;text-align:center;animation:3.4s ease-in-out infinite spin3d;font-family:Unbounded,"Russo One",sans-serif;font-weight:900;font-size:clamp(54px,13vw,170px);line-height:.9;color:#fff;-webkit-text-stroke:5px #000;text-shadow:6px 6px 0 #ff0090,12px 12px 0 #ffe600,18px 18px 0 #00ffe1,24px 24px 0 #7b00ff,30px 30px 0 #000;overflow-wrap:anywhere}
.panel{width:min(780px,100%);background:rgba(5,5,5,.94);border:5px solid #000;box-shadow:10px 10px 0 #ff0090;padding:24px;text-align:center;position:relative}.panel:after{content:"";position:absolute;inset:0;border:3px solid #00ffe1;pointer-events:none}
.counter{font-family:Unbounded,"Russo One",sans-serif;font-weight:900;font-size:clamp(40px,7vw,66px);color:#00ffe1;text-shadow:4px 4px 0 #ff0090;margin:0 0 18px}
.action{position:relative;z-index:1;font-family:"Russo One",sans-serif;font-size:clamp(20px,4vw,28px);padding:12px 26px;background:#ffe600;color:#000;border:5px solid #000;box-shadow:8px 8px 0 #ff0090;cursor:pointer}.action:active{transform:translate(4px,4px);box-shadow:4px 4px 0 #ff0090}.action:disabled{opacity:.65}
.meme-frame{display:flex;justify-content:center;align-items:center;margin-bottom:18px;position:relative;z-index:1}.meme-frame:empty{display:none}.meme-frame img{max-width:100%;max-height:60vh;object-fit:contain;border:5px solid #000;box-shadow:8px 8px 0 #00ff2f}
.bottom-ticker{position:fixed;bottom:0;left:0;right:0;background:#000;border-top:6px solid #ff0090;overflow:hidden;padding:8px 0;z-index:5;white-space:nowrap;font-size:clamp(18px,2.2vw,30px);color:#ffe600;font-weight:900}.bottom-track{display:flex;gap:40px;width:max-content;animation:5.5s linear infinite slideR}.bottom-track span{flex:none}
@media(max-width:700px){body{font-size:15px}main{gap:24px;padding-top:75px}.logo{-webkit-text-stroke:3px #000;text-shadow:4px 4px 0 #ff0090,8px 8px 0 #ffe600,12px 12px 0 #00ffe1,16px 16px 0 #7b00ff,20px 20px 0 #000}.panel{padding:18px 12px}.bottom-ticker{font-size:18px}}
</style></head>
<body>
<div class="site">
<div class="bg-rays"></div><div class="scanlines"></div>
<div class="top-ticker" aria-hidden="true"><div class="ticker-track"><span>★ n1puts.ru ★ n1puts.ru ★ n1puts.ru ★ n1puts.ru ★ n1puts.ru ★</span><span>★ n1puts.ru ★ n1puts.ru ★ n1puts.ru ★ n1puts.ru ★ n1puts.ru ★</span></div></div>
<main>
  <div class="logo-wrap"><h1 class="logo">n1puts.ru</h1></div>
  <section class="panel" aria-label="Кликер">
    <div class="counter" id="count">…</div>
    <button class="action" id="clickButton" type="button">КЛИК</button>
  </section>
  <section class="panel" aria-label="Мемы">
    <div class="meme-frame" id="memeFrame"></div>
    <button class="action" id="moreButton" type="button">ЕЩЁ</button>
  </section>
</main>
<div class="bottom-ticker" aria-hidden="true"><div class="bottom-track"><span>n1puts.ru ★ n1puts.ru ★ n1puts.ru ★ n1puts.ru ★</span><span>n1puts.ru ★ n1puts.ru ★ n1puts.ru ★ n1puts.ru ★</span></div></div>
</div>
<script>
(() => {
 const API='/api/click.php', MEMES='/api/memes.php';
 const count=document.getElementById('count'), click=document.getElementById('clickButton');
 const more=document.getElementById('moreButton'), frame=document.getElementById('memeFrame');
 let files=[], previous='';
 function paint(data) { if(data && Number.isFinite(Number(data.count))) count.textContent=Number(data.count).toLocaleString('ru-RU'); }
 async function refresh() { try { const r=await fetch(API,{cache:'no-store'}); if(!r.ok) throw 0; paint(await r.json()); } catch(e) { count.textContent='—'; } }
 click.addEventListener('click',async()=>{click.disabled=true;try{const r=await fetch(API,{method:'POST',headers:{Accept:'application/json'}});if(!r.ok)throw 0;paint(await r.json());}catch(e){await refresh();}finally{click.disabled=false;}});
 async function getFiles() { try { const r=await fetch(MEMES,{cache:'no-store'}); if(!r.ok)throw 0;const d=await r.json();files=Array.isArray(d)?d:(d.files||[]); }catch(e){files=[];} }
 function next() { if(!files.length){frame.replaceChildren();return;}let a=files.filter(x=>x!==previous);if(!a.length)a=files;const f=a[Math.floor(Math.random()*a.length)];previous=f;const img=document.createElement('img');img.src='/memes/'+f.split('/').map(encodeURIComponent).join('/');img.alt='';img.onerror=()=>img.remove();frame.replaceChildren(img); }
 more.addEventListener('click',async()=>{more.disabled=true;if(!files.length)await getFiles();next();more.disabled=false;});
 refresh();getFiles();
})();
</script>
</body></html>
