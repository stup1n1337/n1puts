<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#100811">
  <title>n1puts.ru — главная хуйня</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800;900&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <script src="/script.js" defer></script>
</head>
<body class="home-page">
  <header class="topbar">
    <nav class="nav">
      <a class="active" href="/">главная</a>
      <a href="/services/">сервисы</a>
    </nav>
  </header>

  <main class="home-main">
    <div class="sun-disc" aria-hidden="true"></div>
    
    <a class="hero-logo" href="/" aria-label="n1puts.ru">
      <span class="logo-shadow" aria-hidden="true">n1puts.ru</span>
      <span class="logo-face">n1puts<span>.ru</span></span>
    </a>
    

    <section class="meme-window" aria-label="Случайный мем">
      <div class="window-bar">
        <span>HUI.PNG</span><span class="window-center">ЛОКАЛЬНАЯ КОЛЛЕКЦИЯ</span><span class="window-dot">● ● ●</span>
      </div>
      <div class="meme-stage" id="memeStage">
        <div class="meme-empty" id="memeEmpty">
          <span class="empty-mark">?</span>
          <strong>КОЛЛЕКЦИЯ ПОКА ПУСТА</strong>
          <span>Закинь свои картинки в <code>img/memes/</code></span>
        </div>
        <img id="memeImage" alt="Случайный мем из коллекции" hidden>
      </div>
      <div class="meme-controls">
        <span class="meme-counter" id="memeCounter">MEME 000</span>
        <button class="button button-yellow" id="nextMeme" type="button">ЕЩЁ</button>
      </div>
    </section>
    <section class="global-clicker" aria-label="Общий кликер">
      <div class="clicker-topline"><span class="live-led"></span> <span class="live-label">LIVE</span></div>
      <h2>ДОЛБАЕБЫ НАКЛИКАЛИ:</h2>
      <div class="global-count" id="globalCount" aria-live="polite">ЗАГРУЗКА...</div>
      <button class="global-click-button" id="globalClick" type="button">НАЖМИ МЕНЯ</button>
      <p class="clicker-footnote" id="clickerStatus">ОДИН СЧЁТЧИК НА ВСЕХ. КАЖДЫЙ КЛИК В ИСТОРИЮ.</p>
    </section>
  </main>

  <footer class="social-footer">
    
    <div class="social-links">
      <a href="https://t.me/peredoz2015" target="_blank" rel="noopener noreferrer">TELEGRAM ↗</a>
    </div>
  </footer>
</body>
</html>
