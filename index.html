<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>n1puts.ru</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Unbounded:wght@900&display=swap" rel="stylesheet">

<style>
html,body{margin:0;padding:0;background:#0a0208;overflow-x:hidden}
*{box-sizing:border-box}
@keyframes strobe{0%{background:#ff0090}12%{background:#00ffe1}25%{background:#ffe600}37%{background:#7b00ff}50%{background:#00ff2f}62%{background:#ff3b00}75%{background:#00ffe1}87%{background:#ff00d4}100%{background:#ff0090}}
@keyframes spin3d{0%{transform:rotateX(0deg) rotateZ(-4deg) scale(1)}25%{transform:rotateX(18deg) rotateZ(5deg) scale(1.06)}50%{transform:rotateX(0deg) rotateZ(-6deg) scale(.96)}75%{transform:rotateX(-16deg) rotateZ(4deg) scale(1.08)}100%{transform:rotateX(0deg) rotateZ(-4deg) scale(1)}}


@keyframes hue{from{filter:hue-rotate(0deg)}to{filter:hue-rotate(360deg)}}
@keyframes shake{0%,100%{transform:translate(0,0) rotate(0)}20%{transform:translate(-9px,4px) rotate(-1.2deg)}40%{transform:translate(7px,-6px) rotate(1.4deg)}60%{transform:translate(-5px,-3px) rotate(-.8deg)}80%{transform:translate(8px,5px) rotate(1deg)}}
@keyframes wobble{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes float1{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-26px) rotate(3deg)}}
@keyframes crawl{from{transform:translateX(100vw)}to{transform:translateX(-120%)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
body{font-family:"Russo One",Impact,sans-serif;color:#fff}
.site{position:relative;min-height:100vh;overflow:hidden;font-family:"Russo One",Impact,sans-serif;animation:1.1s steps(1) infinite strobe;cursor:crosshair;user-select:none;-webkit-tap-highlight-color:transparent}
.bg-rays{position:fixed;inset:0;z-index:0;background:repeating-conic-gradient(rgba(0,0,0,.55) 0deg,rgba(0,0,0,.55) 9deg,rgba(255,255,255,.12) 9deg,rgba(255,255,255,.12) 18deg);animation:6s linear infinite hue;pointer-events:none}
.scanlines{position:fixed;inset:0;z-index:10;background:repeating-linear-gradient(0deg,rgba(0,0,0,.35) 0,rgba(0,0,0,.35) 2px,transparent 2px,transparent 4px);pointer-events:none}


main{position:relative;z-index:1;padding:clamp(70px,14vw,120px) clamp(12px,4vw,24px) 90px;display:flex;flex-direction:column;align-items:center;gap:30px}
.logo-wrap{perspective:900px;width:100%}.logo{margin:0;text-align:center;animation:3.4s ease-in-out infinite spin3d;font-family:Unbounded,"Russo One",sans-serif;font-weight:900;font-size:clamp(54px,13vw,170px);line-height:.9;color:#fff;-webkit-text-stroke:5px #000;text-shadow:6px 6px 0 #ff0090,12px 12px 0 #ffe600,18px 18px 0 #00ffe1,24px 24px 0 #7b00ff,30px 30px 0 #000;overflow-wrap:anywhere}
.panel{width:min(780px,100%);background:rgba(5,5,5,.94);border:5px solid #000;box-shadow:10px 10px 0 #ff0090;padding:24px;text-align:center;position:relative}.panel:after{content:"";position:absolute;inset:0;border:3px solid #00ffe1;pointer-events:none}
.counter{font-family:Unbounded,"Russo One",sans-serif;font-weight:900;font-size:clamp(40px,7vw,66px);color:#00ffe1;text-shadow:4px 4px 0 #ff0090;margin:0 0 18px}
.combo-line{display:inline-block;margin:0 auto 18px;padding:7px 14px;background:#000;color:#ffe600;border:2px dashed #ff0090;font:900 clamp(15px,2.2vw,20px)/1.2 "Russo One",sans-serif;text-shadow:2px 2px #7b00ff;min-width:150px}
.combo-line.active{animation:pulse .25s ease-in-out infinite;box-shadow:0 0 12px #ff0090}
.action{position:relative;z-index:1;font-family:"Russo One",sans-serif;font-size:clamp(20px,4vw,28px);padding:12px 26px;background:#ffe600;color:#000;border:5px solid #000;box-shadow:8px 8px 0 #ff0090;cursor:pointer}.action:active{transform:translate(4px,4px);box-shadow:4px 4px 0 #ff0090}.action:disabled{opacity:.65}
.meme-frame{display:flex;justify-content:center;align-items:center;margin-bottom:18px;position:relative;z-index:1}.meme-frame:empty{display:none}.meme-frame img{max-width:100%;max-height:60vh;object-fit:contain;border:5px solid #000;box-shadow:8px 8px 0 #00ff2f}

@media(max-width:700px){body{font-size:15px}main{gap:24px;padding-top:75px}.logo{-webkit-text-stroke:3px #000;text-shadow:4px 4px 0 #ff0090,8px 8px 0 #ffe600,12px 12px 0 #00ffe1,16px 16px 0 #7b00ff,20px 20px 0 #000}.panel{padding:18px 12px}}

@keyframes fly {0%{transform:translate(-50%,-50%) scale(.2) rotate(0deg);opacity:1}100%{transform:translate(-50%,-320%) scale(2.4) rotate(30deg);opacity:0}}
@keyframes blinky{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes popin{from{transform:scale(.2) rotate(-14deg);opacity:0}to{transform:scale(1) rotate(-2deg);opacity:1}}
.site.is-chaos{animation:shake .18s linear infinite, hue 1.2s linear infinite!important}
.panel-label{font-size:12px;letter-spacing:1px;color:#00ffe1;margin:-4px 0 8px;font-family:"Russo One",sans-serif}
.live-line{display:flex;align-items:center;justify-content:center;gap:8px;color:#00ff2f;font:900 13px/1 "Russo One",sans-serif;margin:0 0 12px;text-shadow:2px 2px #000}
.live-dot{width:10px;height:10px;border-radius:50%;background:#00ff2f;box-shadow:0 0 8px #00ff2f;animation:blinky .8s steps(1) infinite}
.window-panel{padding:0!important;background:#c0c0c0!important;border:5px solid #050505!important;box-shadow:12px 12px 0 #000!important;transform:rotate(-1deg);color:#000}
.window-title{height:48px;background:#000080;color:white;display:flex;align-items:center;justify-content:space-between;padding:5px 10px;font:900 20px "Russo One",sans-serif;text-align:left}
.window-close{font:900 22px Arial,sans-serif;background:#c0c0c0;border:3px outset white;padding:1px 12px;box-shadow:none;cursor:pointer;color:#000}
.window-content{padding:18px;background:#c0c0c0;color:#000}
.window-content .action{font-size:20px;padding:10px 20px;background:#c0c0c0;border:4px outset white;box-shadow:none}
.window-content .action:active{border-style:inset;transform:translate(1px,1px)}
.meme-frame{min-height:130px;background:#eee;border:4px inset #ddd;padding:8px;margin-bottom:16px}
.meme-frame:empty:before{content:"";display:block;min-height:100px}
.meme-frame img{max-width:100%;max-height:55vh;object-fit:contain;border:0;box-shadow:none}
.social-panel{background:#050505;border:5px solid #000;box-shadow:10px 10px 0 #7b00ff;padding:22px;width:min(780px,100%);text-align:center;animation:wobble .55s ease-in-out infinite}
.social-title{font-size:clamp(22px,4vw,34px);color:#ffe600;-webkit-text-stroke:1px #000;text-shadow:4px 4px #ff0090;margin:0 0 20px}
.social-links{display:flex;justify-content:center;flex-wrap:wrap;gap:14px}
.social-link{display:inline-block;text-decoration:none;background:#ffe600;color:#000;border:5px solid #000;box-shadow:7px 7px #ff0090;padding:12px 18px;font:900 18px "Russo One",sans-serif;transition:transform .1s}
.social-link:hover{transform:translate(-3px,-3px) rotate(-2deg);filter:hue-rotate(45deg)}
@media(max-width:700px){.window-title{height:42px;font-size:17px}.window-content{padding:12px}.social-panel{padding:16px}.social-link{font-size:16px;padding:10px 12px}}

</style></head>
<body>
<div class="site">
<div class="bg-rays"></div><div class="scanlines"></div>

<main>
  <div class="logo-wrap"><h1 class="logo">n1puts.ru</h1></div>
  <section class="panel" aria-label="Кликер">
    <div class="live-line"><span class="live-dot"></span>LIVE</div>
    <div class="panel-label">ОБЩЕЕ КОЛИЧЕСТВО КЛИКОВ:</div>
    <div class="counter" id="count">…</div>
    <div class="combo-line" id="combo">COMBO: 0x</div>
    <button class="action" id="clickButton" type="button">КЛИК</button>
  </section>
  <section class="panel window-panel" aria-label="Мемы">
    <div class="window-title"><span>hui.png</span><button class="window-close" id="closeMeme" type="button" aria-label="Закрыть">X</button></div>
    <div class="window-content">
      <div class="meme-frame" id="memeFrame"></div>
      <button class="action" id="moreButton" type="button">ЕЩЁ</button>
    </div>
  </section>
  <section class="social-panel" aria-label="Мои соц сети">
    
    <div class="social-links">
      <a class="social-link" href="https://t.me/peredoz2015" target="_blank" rel="noopener noreferrer">TELEGRAM</a>
      <a class="social-link" href="https://www.youtube.com/@n1puts" target="_blank" rel="noopener noreferrer">YOUTUBE</a>
      <a class="social-link" href="https://steamcommunity.com/id/n1puts/" target="_blank" rel="noopener noreferrer">STEAM</a>
    </div>
  </section>
</main>

</div>
<script>
(() => {
 const API='/api/click.php', MEMES='/memes/memes.json';
 const count=document.getElementById('count'), click=document.getElementById('clickButton');
 const more=document.getElementById('moreButton'), frame=document.getElementById('memeFrame');
 let files=[], previous='';
 function paint(data) { if(data && Number.isFinite(Number(data.count))) count.textContent=Number(data.count).toLocaleString('ru-RU'); }
 async function refresh() { try { const r=await fetch(API,{cache:'no-store'}); if(!r.ok) throw 0; paint(await r.json()); } catch(e) { count.textContent='—'; } }
 click.addEventListener('click',async()=>{
   comboCount++;
   const comboEl=document.getElementById('combo');
   comboEl.textContent='COMBO: '+comboCount+'x';
   comboEl.classList.add('active');
   clearTimeout(comboResetTimer);
   comboResetTimer=setTimeout(()=>{comboCount=0;comboEl.textContent='COMBO: 0x';comboEl.classList.remove('active');},1000);
   click.disabled=true;try{const r=await fetch(API,{method:'POST',headers:{Accept:'application/json'}});if(!r.ok)throw 0;paint(await r.json());}catch(e){await refresh();}finally{click.disabled=false;}});
 async function getFiles() {
   try {
     const r=await fetch(MEMES,{cache:'no-store'});
     if(!r.ok) throw new Error('HTTP '+r.status);
     const d=await r.json();
     files=Array.isArray(d)?d:(Array.isArray(d.files)?d.files:[]);
   } catch(e) { files=[]; console.error('Не удалось загрузить /memes/memes.json:',e); }
 }
 function next() {
   if(!files.length) {
     frame.replaceChildren();
     const msg=document.createElement('div');
     msg.textContent='Добавь имена файлов в /memes/memes.json';
     msg.style.cssText='padding:24px;color:#000;font:bold 14px Arial;text-align:center;overflow-wrap:anywhere';
     frame.appendChild(msg);
     return;
   }
   let a=files.filter(x=>x!==previous); if(!a.length)a=files;
   const f=a[Math.floor(Math.random()*a.length)]; previous=f;
   const img=document.createElement('img'); img.alt=''; img.loading='eager';
   img.onload=()=>frame.replaceChildren(img);
   img.onerror=()=>{frame.replaceChildren();const msg=document.createElement('div');msg.textContent='Не удалось открыть '+f;msg.style.cssText='padding:24px;color:#000;font:bold 14px Arial;overflow-wrap:anywhere';frame.appendChild(msg);};
   img.src='/memes/'+f.split('/').map(encodeURIComponent).join('/');
 }
 more.addEventListener('click',async()=>{more.disabled=true;try{if(!files.length)await getFiles();next();}finally{more.disabled=false;}});

 const words=["n1puts.ru","ХУЙНЯ!!!","АХУЕТЬ","+1","ОЙ","ХУЙНЯ×2","N1PUTS","ЧТО?!","ЛОЛ","ЖЕСТЬ","ААА"];
 const colors=["#ff0090","#ffe600","#00ffe1","#00ff2f","#ffffff","#7b00ff"];
 let audioCtx=null,lastHit=0,chaosTimer=null,comboCount=0,comboResetTimer=null;
 function beep(freq){
   try{
     audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
     const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
     osc.type="square";osc.frequency.value=freq;gain.gain.value=.045;
     osc.connect(gain);gain.connect(audioCtx.destination);
     osc.start();osc.stop(audioCtx.currentTime+.075);
   }catch(e){}
 }
 function burst(x,y){
   const now=Date.now(),combo=now-lastHit<900;lastHit=now;
   beep(300+Math.random()*500+(combo?350:0));
   const n=3+Math.floor(Math.random()*4);
   for(let i=0;i<n;i++){
     const el=document.createElement('div');
     el.textContent=words[Math.floor(Math.random()*words.length)];
     el.style.cssText='position:fixed;left:'+(x+(Math.random()-.5)*240)+'px;top:'+(y+(Math.random()-.5)*140)+'px;z-index:99;pointer-events:none;white-space:nowrap;font-family:Unbounded,"Russo One",sans-serif;font-weight:900;font-size:'+(28+Math.random()*55)+'px;color:'+colors[Math.floor(Math.random()*colors.length)]+';-webkit-text-stroke:2px #000;text-shadow:4px 4px #000;animation:fly 1.5s ease-out forwards;transform:rotate('+(Math.random()-.5)*45+'deg)';
     document.body.appendChild(el);setTimeout(()=>el.remove(),1550);
   }
   const site=document.querySelector('.site');site.classList.add('is-chaos');
   clearTimeout(chaosTimer);chaosTimer=setTimeout(()=>site.classList.remove('is-chaos'),650);
 }
 document.querySelector('.site').addEventListener('click',e=>{
   if(e.target.closest('a')||e.target.id==='closeMeme')return;
   burst(e.clientX,e.clientY);
 });
 document.getElementById('closeMeme').addEventListener('click',()=>{
   const frame=document.getElementById('memeFrame');
   frame.innerHTML='<div style="font:900 20px Arial;color:#000;padding:24px">Файл закрыт.</div>';
   document.getElementById('moreButton').textContent='ОТКРЫТЬ';
 });
 document.getElementById('moreButton').addEventListener('click',()=>{
   document.getElementById('moreButton').textContent='ЕЩЁ';
   if(document.getElementById('memeFrame').querySelector('div'))document.getElementById('memeFrame').replaceChildren();
 });

 refresh();getFiles();
})();
</script>
</body></html>
